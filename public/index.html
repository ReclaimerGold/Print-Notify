<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Print-Notify</title>
  <style>
    :root {
      --bg:#f4f5f7; --card:#fff; --ink:#1b2430; --muted:#6b7280; --line:#e6e8ec;
      --accent:#26374a; --accent-ink:#fff;
      --green:#16a34a; --amber:#d97706; --red:#dc2626; --grey:#9ca3af;
      --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05), 0 10px 26px rgba(0,0,0,.05);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1319; --card:#161c25; --ink:#e7eaef; --muted:#93a0b1; --line:#28313d; --accent:#3d5673; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink);
      font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    .wrap { max-width:1000px; margin:0 auto; padding:1.5rem 1rem 4rem; }
    header { display:flex; align-items:center; gap:.9rem; margin-bottom:1.4rem; }
    header img { height:42px; width:auto; }
    header .title { font-size:1.35rem; font-weight:700; letter-spacing:-.01em; }
    header .sub { color:var(--muted); font-size:.83rem; margin-top:.15rem; }
    .grid { display:grid; grid-template-columns:1fr; gap:1.1rem; }
    @media (min-width:820px){ .grid { grid-template-columns:1fr 360px; align-items:start; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:1.1rem 1.2rem; }
    .card + .card { margin-top:1.1rem; }
    .card h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
      margin:0 0 .85rem; font-weight:700; }
    .status-line { display:flex; align-items:center; gap:.55rem; font-size:1.05rem; font-weight:650; margin-bottom:.75rem; }
    .dot { width:.62rem; height:.62rem; border-radius:50%; flex:0 0 auto; }
    .green{background:var(--green)} .amber{background:var(--amber)} .red{background:var(--red)} .grey{background:var(--grey)}
    .meta { display:grid; grid-template-columns:max-content 1fr; gap:.35rem .9rem; font-size:.86rem; }
    .meta .k { color:var(--muted); }
    .meta code { font-size:.78rem; word-break:break-all; color:var(--muted); }
    .note { margin-top:.75rem; padding:.55rem .75rem; border-radius:9px; font-size:.82rem;
      background:color-mix(in srgb, var(--amber) 13%, transparent); color:var(--amber); }
    .src { display:flex; align-items:flex-start; gap:.65rem; padding:.6rem 0; border-top:1px solid var(--line); }
    .src:first-child { border-top:0; padding-top:0; }
    .src .name { font-weight:600; }
    .src .desc { color:var(--muted); font-size:.82rem; }
    .src .tag { margin-left:auto; font-size:.7rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
      color:var(--muted); padding-top:.15rem; }
    .actions { display:flex; flex-wrap:wrap; gap:.55rem; }
    button { font:inherit; font-weight:600; padding:.55rem 1rem; border-radius:10px; border:1px solid var(--line);
      background:var(--card); color:var(--ink); cursor:pointer; transition:border-color .12s, transform .05s; }
    button:hover { border-color:var(--accent); }
    button:active { transform:translateY(1px); }
    button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
    #msg { min-height:1.3rem; margin-top:.8rem; font-size:.85rem; color:var(--muted); }
    .preview-card { position:sticky; top:1rem; }
    .paper-wrap { display:flex; justify-content:center; border-radius:10px; padding:1.3rem;
      background:repeating-linear-gradient(45deg, transparent, transparent 11px,
        color-mix(in srgb, var(--ink) 4%, transparent) 11px, color-mix(in srgb, var(--ink) 4%, transparent) 22px); }
    .paper { background:#fff; width:272px; box-shadow:0 5px 24px rgba(0,0,0,.3); border-radius:3px; overflow:hidden; }
    .paper img { width:100%; display:block; }
    .paper.loading { min-height:130px; display:flex; align-items:center; justify-content:center; }
    .hint { color:var(--muted); font-size:.8rem; text-align:center; padding:1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="/logo.png" alt="Ferrix Systems" />
      <div>
        <div class="title">Print-Notify</div>
        <div class="sub" id="sub">loading…</div>
      </div>
    </header>

    <div class="grid">
      <div>
        <div class="card">
          <h2>Printer</h2>
          <div class="status-line" id="printer-status"><span class="dot grey"></span> Checking…</div>
          <div class="meta" id="printer-meta"></div>
          <div class="note" id="printer-note" hidden></div>
        </div>

        <div class="card">
          <h2>Notification sources</h2>
          <div id="sources">loading…</div>
        </div>

        <div class="card">
          <h2>Actions</h2>
          <div class="actions">
            <button class="primary" onclick="post('/api/print','Printing digest…')">Print digest</button>
            <button onclick="preview()">Refresh preview</button>
            <button onclick="post('/api/poll','Printing urgent…')">Print urgent</button>
            <button onclick="post('/api/test','Printing test…')">Test print</button>
          </div>
          <div id="msg"></div>
        </div>
      </div>

      <div class="card preview-card">
        <h2>Receipt preview</h2>
        <div class="paper-wrap">
          <div class="paper loading" id="paper"><span class="hint">Loading…</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SOURCE_INFO = {
      'google-tasks': ['Google Tasks', 'Task & grocery lists with checkboxes'],
      weather:  ['Weather', 'Current conditions + 3-day forecast'],
      github:   ['GitHub', 'New pull requests (last 24h, top 3)'],
      calendar: ['Calendar', "Today's events"],
      news:     ['Local news', 'Recent headlines'],
    };

    const $ = (id) => document.getElementById(id);
    const dot = (c) => `<span class="dot ${c}"></span>`;

    async function refresh() {
      try {
        const s = await (await fetch('/api/status')).json();
        $('sub').textContent =
          `Digest ${s.schedule.morningDigest} · urgent ${s.schedule.pollUrgent} · ${s.timezone}`
          + (s.printer.dryRun ? ' · DRY RUN' : '');
        $('sources').innerHTML = s.sources.map((x) => {
          const [name, desc] = SOURCE_INFO[x.name] || [x.name, ''];
          return `<div class="src">${dot(x.enabled ? 'green' : 'grey')}`
            + `<div><div class="name">${name}</div><div class="desc">${desc}</div></div>`
            + `<span class="tag">${x.enabled ? 'on' : 'off'}</span></div>`;
        }).join('');
      } catch (e) { $('sub').textContent = 'status unavailable'; }
    }

    async function refreshPrinter() {
      try {
        const p = await (await fetch('/api/printer')).json();
        let color = 'green', label = 'Ready';
        if (!p.connected) { color = 'red'; label = 'Printer offline'; }
        else if (p.state === 'disabled') { color = 'red'; label = 'Queue disabled'; }
        else if (p.reasons && p.reasons.length) { color = 'amber'; label = p.reasons.join(', '); }
        $('printer-status').innerHTML = dot(color) + ' ' + label;

        const rows = [
          ['Queue', p.queue],
          ['Device', `<code>${p.deviceUri ?? '—'}</code>`],
          ['Accepting jobs', p.accepting ? 'yes' : 'no'],
          ['Recent jobs', (p.recentJobs || []).map((j) => j.id).join(', ') || '—'],
        ];
        $('printer-meta').innerHTML = rows.map(([k, v]) => `<span class="k">${k}</span><span>${v}</span>`).join('');
        const note = $('printer-note');
        if (p.note && p.note !== 'OK') { note.textContent = p.note; note.hidden = false; }
        else note.hidden = true;
      } catch (e) {
        $('printer-status').innerHTML = dot('grey') + ' Printer info unavailable';
      }
    }

    async function preview() {
      const paper = $('paper');
      $('msg').textContent = 'Rendering preview…';
      paper.classList.add('loading');
      paper.innerHTML = '<span class="hint">Rendering…</span>';
      try {
        const r = await (await fetch('/api/preview')).json();
        const img = new Image();
        img.onload = () => { paper.classList.remove('loading'); paper.innerHTML = ''; paper.appendChild(img); };
        img.onerror = () => { paper.innerHTML = '<span class="hint">Preview failed.</span>'; };
        img.src = '/api/receipt.png?t=' + Date.now();
        const errs = r.errors?.length ? ` · errors: ${JSON.stringify(r.errors)}` : '';
        $('msg').textContent = `${r.count ?? 0} items from ${(r.sources || []).join(', ') || 'no sources'}${errs}`;
      } catch (e) {
        paper.innerHTML = '<span class="hint">Preview failed.</span>';
        $('msg').textContent = '';
      }
    }

    async function post(url, label) {
      $('msg').textContent = label;
      try {
        const r = await (await fetch(url, { method: 'POST' })).json();
        $('msg').textContent = r.ok ? '✓ ' + (r.count ?? r.printed ?? 'done') : '✗ ' + r.error;
      } catch (e) { $('msg').textContent = '✗ ' + e; }
      refreshPrinter();
    }

    refresh();
    refreshPrinter();
    preview();
    setInterval(refreshPrinter, 15000);
  </script>
</body>
</html>
